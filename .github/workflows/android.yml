name: Android build
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test case data and indicator extraction
        run: npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install API 36
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Lint and compile Android packages
        run: gradle --no-daemon lintDebug assembleDebug bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: CENTINELLia-1.2.1-android
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/bundle/release/app-release.aab
            app/build/reports/lint-results-debug.html
          retention-days: 14
  android-smoke:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: CENTINELLia-1.2.1-android
          path: android-build
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          script: python3 tests/android-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CENTINELLia-android-device-check
          path: test-results/android
          retention-days: 14
  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Exercise shared UI on phone and desktop viewports
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory app/src/main/assets > /tmp/centinellia-preview.log 2>&1 &
          for attempt in $(seq 1 20); do curl -sf http://127.0.0.1:4173 > /dev/null && break; sleep 1; done
          PLAYWRIGHT_BUNDLED=1 node tests/ui.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CENTINELLia-ui-screenshots
          path: docs/screenshots/*.png
          retention-days: 14
